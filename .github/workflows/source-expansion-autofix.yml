name: One-time Source Expansion Cleanup

on:
  push:
    branches: [agent/autonomous-source-expansion]
    paths:
      - '.github/workflows/source-expansion-autofix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/autonomous-source-expansion
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply precise type fixes and Ruff import cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/airfryer_rankings/source_registry.py')
          text = registry.read_text(encoding='utf-8')
          old = '''        if record.get("quality_score") is not None:\n            try:\n                scores.append(float(record["quality_score"]))\n            except (TypeError, ValueError):\n                pass\n'''
          new = '''        score_value = record.get("quality_score")\n        if isinstance(score_value, (int, float, str)):\n            try:\n                scores.append(float(score_value))\n            except ValueError:\n                pass\n'''
          assert old in text
          registry.write_text(text.replace(old, new), encoding='utf-8')

          expansion = Path('src/airfryer_rankings/source_expansion.py')
          text = expansion.read_text(encoding='utf-8')
          old = '''        response = requests.get(\n            "https://api.search.brave.com/res/v1/web/search",\n            params={"q": query, "count": min(20, max(1, limit)), "safesearch": "moderate"},\n            headers={"Accept": "application/json", "X-Subscription-Token": self.api_key},\n            timeout=20,\n        )\n'''
          new = '''        params: dict[str, str | int] = {\n            "q": query,\n            "count": min(20, max(1, limit)),\n            "safesearch": "moderate",\n        }\n        response = requests.get(\n            "https://api.search.brave.com/res/v1/web/search",\n            params=params,\n            headers={"Accept": "application/json", "X-Subscription-Token": self.api_key},\n            timeout=20,\n        )\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''            response = requests.get(\n                "https://www.googleapis.com/customsearch/v1",\n                params={"key": self.api_key, "cx": self.cx, "q": query, "num": count, "start": start},\n                timeout=20,\n            )\n'''
          new = '''            params: dict[str, str | int] = {\n                "key": self.api_key,\n                "cx": self.cx,\n                "q": query,\n                "num": count,\n                "start": start,\n            }\n            response = requests.get(\n                "https://www.googleapis.com/customsearch/v1",\n                params=params,\n                timeout=20,\n            )\n'''
          assert old in text
          text = text.replace(old, new)
          old = '    output = {context.slug: [] for context in contexts}\n'
          new = '    output: dict[str, list[DiscoveryHit]] = {context.slug: [] for context in contexts}\n'
          assert old in text
          text = text.replace(old, new)
          old = '''        record["rejection_cooldown_until"] = (parse_dt(run_at) + timedelta(days=int(policy.get("automatic_rejection_cooldown_days", 30))) if parse_dt(run_at) else datetime.now(timezone.utc) + timedelta(days=30)).isoformat()\n'''
          new = '''        run_datetime = parse_dt(run_at) or datetime.now(timezone.utc)\n        cooldown_days = int(policy.get("automatic_rejection_cooldown_days", 30))\n        record["rejection_cooldown_until"] = (run_datetime + timedelta(days=cooldown_days)).isoformat()\n'''
          assert old in text
          expansion.write_text(text.replace(old, new), encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = '''# Source expansion intentionally groups lifecycle constants alongside imports in\n# gate order; the unused normalization import remains reserved for provider plugins.\n"src/airfryer_rankings/source_expansion.py" = ["I001", "F401"]\n"src/airfryer_rankings/source_registry.py" = ["F401"]\n'''
          assert old in text
          pyproject.write_text(text.replace(old, ''), encoding='utf-8')
          PY
          pip install ruff==0.16.3
          ruff check src/airfryer_rankings/source_expansion.py src/airfryer_rankings/source_registry.py --fix
          ruff check src tests scripts/source_registry_admin.py
      - name: Commit cleanup back to feature branch
        run: |
          rm .github/workflows/source-expansion-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/airfryer_rankings/source_expansion.py src/airfryer_rankings/source_registry.py pyproject.toml .github/workflows/source-expansion-autofix.yml
          git commit -m 'Fix source expansion typing and imports'
          git push origin HEAD:agent/autonomous-source-expansion
