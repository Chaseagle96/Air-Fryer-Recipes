name: Recipe Intelligence Authoritative Refresh

on:
  workflow_run:
    workflows:
      - Recipe Intelligence Source Catalog Sync
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-invalidate.yml'
      - '.github/workflows/authoritative-refresh.yml'
      - '.github/workflows/authority-postcheck.yml'
      - 'src/airfryer_rankings/authority.py'
      - 'scripts/ranking_authority.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recipe-intelligence-authoritative-refresh-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch full Air Fryer refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily

      - name: Dispatch full Slow Cooker refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run slow-cooker.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily

      - name: Record dispatch contract
        run: |
          echo 'Both production verticals were dispatched in daily mode.'
          echo 'Serving authority remains refresh_required until their successful workflow_run postchecks publish a matching authority generation.'
