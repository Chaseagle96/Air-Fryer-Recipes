name: Recipe Intelligence Authoritative Refresh

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recipe-intelligence-authoritative-refresh-main
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch full Air Fryer refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily

      - name: Dispatch full Slow Cooker refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run slow-cooker.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=daily

      - name: Record dispatch contract
        run: |
          echo 'Both production verticals were manually dispatched in daily mode.'
          echo 'Automatic source/catalog recovery is serialized through Recipe Intelligence Authority Invalidation so invalidation always finishes before these full refreshes start.'
