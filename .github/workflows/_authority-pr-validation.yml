name: TEMP Authority PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_authority-pr-validation.yml'
      - '.github/workflows/authority-*.yml'
      - '.github/workflows/authoritative-refresh.yml'
      - 'src/airfryer_rankings/authority.py'
      - 'src/airfryer_rankings/ops.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  authority:
    if: github.event.pull_request.head.ref == 'pony-tail/pass-5-authority-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run authority contract tests
        run: pytest -q tests/test_authority_decisions.py tests/test_authority_orchestration_workflows.py
      - name: Exercise both vertical decision and freshness operations
        run: |
          set -euo pipefail
          for vertical in air-fryer slow-cooker; do
            PYTHONPATH=src python -m airfryer_rankings.ops authority-current --vertical "$vertical"
            PYTHONPATH=src python -m airfryer_rankings.ops authority-decision --vertical "$vertical"
            PYTHONPATH=src python -m airfryer_rankings.ops authority-decision --vertical "$vertical" --recovery
          done
      - name: Exercise isolated fail-closed lifecycle fixtures
        run: |
          PYTHONPATH=src python - <<'PY'
          from airfryer_rankings.authority import evaluate_authority, ranking_is_current

          assert evaluate_authority({"authoritative": True, "status": "authoritative"}) == "noop"
          assert evaluate_authority({"authoritative": True, "status": "authoritative"}, ranking_current=False) == "invalidate"
          assert evaluate_authority({"authoritative": False, "status": "refresh_required"}) == "refresh_required"
          assert evaluate_authority({"authoritative": False, "status": "refresh_required"}, recovery_requested=True) == "recover"
          assert evaluate_authority({}, recovery_requested=True) == "recover"
          assert not ranking_is_current(state={"url_catalog": {"air": {}}}, summary={"catalog_urls": 1}, metrics={})
          print('noop, invalidate, refresh_required, recover, stale, and missing-evidence cases passed')
          PY