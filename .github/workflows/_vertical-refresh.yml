name: Reusable vertical refresh

on:
  workflow_call:
    inputs:
      vertical:
        description: Canonical vertical identifier
        required: true
        type: string
      mode:
        description: Requested refresh mode
        required: true
        type: string
      production:
        description: Whether this run may publish state
        required: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  RECIPE_INTELLIGENCE_VERTICAL: ${{ inputs.vertical == 'slow-cooker' && 'Slow Cooker' || 'Air Fryer' }}
  RECIPE_INTELLIGENCE_VERTICAL_SLUG: ${{ inputs.vertical == 'slow-cooker' && 'slow_cooker' || 'air_fryer' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      production: ${{ inputs.production }}
      mode: ${{ inputs.mode }}
      publishable: ${{ steps.authority.outputs.publishable }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and quality tooling
        run: pip install -r requirements-dev.txt

      - name: Resolve vertical workspace
        id: vertical
        shell: bash
        run: |
          root=$(PYTHONPATH=src python -m airfryer_rankings.ops print-root --vertical "${{ inputs.vertical }}")
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Audit dependencies and generate CycloneDX SBOM
        if: inputs.vertical == 'air-fryer'
        run: |
          mkdir -p output
          pip-audit -r requirements.txt -f cyclonedx-json -o output/sbom.json

      - name: Lint source and tests
        shell: bash
        run: |
          root='${{ steps.vertical.outputs.root }}'
          mkdir -p "$root/output"
          set +e
          ruff check src tests 2>&1 | tee "$root/output/ruff.txt"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Static type analysis
        shell: bash
        run: |
          root='${{ steps.vertical.outputs.root }}'
          mkdir -p "$root/output"
          set +e
          mypy src/airfryer_rankings 2>&1 | tee "$root/output/mypy.txt"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Test with branch coverage
        shell: bash
        run: |
          root='${{ steps.vertical.outputs.root }}'
          mkdir -p "$root/output"
          set +e
          PYTHONPATH=src pytest --cov=airfryer_rankings --cov-report=term-missing --cov-report=xml 2>&1 | tee "$root/output/pytest.txt"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Refresh rankings
        shell: bash
        run: |
          PYTHONPATH=src python -m airfryer_rankings.ops run-vertical \
            --vertical "${{ inputs.vertical }}" \
            --mode "${{ inputs.mode }}"

      - name: Rebuild and validate mobile corpus
        shell: bash
        run: |
          PYTHONPATH=src python -m airfryer_rankings.ops rebuild-mobile-corpus \
            --vertical "${{ inputs.vertical }}"
          PYTHONPATH=src python -m airfryer_rankings.ops validate-mobile-manifest \
            --vertical "${{ inputs.vertical }}"

      - name: Certify authority before publication
        id: authority
        if: inputs.production
        shell: bash
        run: |
          set +e
          output=$(PYTHONPATH=src python -m airfryer_rankings.ops publish-authority \
            --vertical "${{ inputs.vertical }}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "hourly" ] && \
             grep -Fq 'new source/catalog/model generation requires a daily or deep refresh before certification' <<<"$output"; then
            echo 'publishable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Publication deferred until a daily/deep refresh completes.'
            exit 0
          fi
          echo 'publishable=false' >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Capture sanitized publisher fixture candidates
        if: inputs.vertical == 'air-fryer' && inputs.mode == 'deep' && inputs.production
        run: PYTHONPATH=src python -m airfryer_rankings.fixture_capture --output output/fixture_candidates

      - name: Upload Excel workbook
        if: always() && hashFiles(format('{0}/output/*_rankings.xlsx', steps.vertical.outputs.root)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-intelligence-${{ inputs.vertical }}-rankings-${{ github.run_number }}-${{ inputs.mode || 'validation' }}
          retention-days: 30
          path: ${{ steps.vertical.outputs.root }}/output/*_rankings.xlsx

      - name: Upload DuckDB analytical cache
        if: always() && hashFiles(format('{0}/output/*_analytics.duckdb', steps.vertical.outputs.root)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-intelligence-${{ inputs.vertical }}-analytics-${{ github.run_number }}-${{ inputs.mode || 'validation' }}
          retention-days: 30
          path: ${{ steps.vertical.outputs.root }}/output/*_analytics.duckdb

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-intelligence-${{ inputs.vertical }}-diagnostics-${{ github.run_number }}-${{ inputs.mode || 'validation' }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ steps.vertical.outputs.root }}/output/sbom.json
            ${{ steps.vertical.outputs.root }}/output/ruff.txt
            ${{ steps.vertical.outputs.root }}/output/mypy.txt
            ${{ steps.vertical.outputs.root }}/output/pytest.txt
            ${{ steps.vertical.outputs.root }}/output/quality_gate.json
            ${{ steps.vertical.outputs.root }}/output/pipeline_metrics.json
            ${{ steps.vertical.outputs.root }}/output/pipeline_metrics.csv
            ${{ steps.vertical.outputs.root }}/output/historical_backtest.csv
            ${{ steps.vertical.outputs.root }}/output/hyperparameter_evaluation.csv
            ${{ steps.vertical.outputs.root }}/output/evidence_calibration.csv
            ${{ steps.vertical.outputs.root }}/output/evidence_label_results.csv
            ${{ steps.vertical.outputs.root }}/output/dedupe_label_queue.csv
            ${{ steps.vertical.outputs.root }}/output/storage_health.json
            ${{ steps.vertical.outputs.root }}/output/authority.json
            ${{ steps.vertical.outputs.root }}/output/summary.json
            coverage.xml

      - name: Upload history Parquet archive
        if: always() && hashFiles(format('{0}/output/history_archive.parquet', steps.vertical.outputs.root)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-intelligence-${{ inputs.vertical }}-history-${{ github.run_number }}
          retention-days: 30
          path: ${{ steps.vertical.outputs.root }}/output/history_archive.parquet

      - name: Upload candidate regression fixtures
        if: always() && inputs.vertical == 'air-fryer' && hashFiles('output/fixture_candidates/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recipe-intelligence-fixture-candidates-${{ github.run_number }}
          retention-days: 30
          path: output/fixture_candidates

      - name: Upload Pages artifact
        if: inputs.vertical == 'air-fryer' && inputs.production && steps.authority.outputs.publishable == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.vertical.outputs.root }}/docs

      - name: Commit refreshed state, evidence, reports, and dashboard
        if: inputs.production && steps.authority.outputs.publishable == 'true'
        shell: bash
        run: |
          root='${{ steps.vertical.outputs.root }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root/data" "$root/docs"
          for file in \
            "$root/output/leaderboard.csv" \
            "$root/output/top50.csv" \
            "$root/output/source_coverage.csv" \
            "$root/output/source_reliability.csv" \
            "$root/output/source_health.csv" \
            "$root/output/ranking_robustness.csv" \
            "$root/output/dedupe_benchmark.csv" \
            "$root/output/dedupe_label_queue.csv" \
            "$root/output/pipeline_metrics.csv" \
            "$root/output/historical_backtest.csv" \
            "$root/output/hyperparameter_evaluation.csv" \
            "$root/output/evidence_calibration.csv" \
            "$root/output/evidence_label_results.csv" \
            "$root/output/publication_quality_gate.csv" \
            "$root/output/anomalies.csv" \
            "$root/output/quality_gate.json" \
            "$root/output/pipeline_metrics.json" \
            "$root/output/storage_health.json" \
            "$root/output/authority.json" \
            "$root/output/summary.json"; do
            [ ! -e "$file" ] || git add "$file"
          done
          if git diff --cached --quiet; then
            echo "No ${{ inputs.vertical }} ranking changes to commit."
            exit 0
          fi
          git commit -m "Refresh ${{ inputs.vertical }} rankings (${{ inputs.mode }})"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-pages:
    if: inputs.vertical == 'air-fryer' && inputs.production && needs.refresh.outputs.publishable == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

