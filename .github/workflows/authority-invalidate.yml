name: Recipe Intelligence Authority Invalidation

on:
  workflow_run:
    workflows:
      - Recipe Intelligence Source Expansion
      - Recipe Intelligence Source Catalog Sync
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-invalidate.yml'
      - '.github/workflows/authoritative-refresh.yml'
      - '.github/workflows/authority-postcheck.yml'
      - 'src/airfryer_rankings/authority.py'
      - 'scripts/ranking_authority.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipe-intelligence-authority-invalidate-main
  cancel-in-progress: false

jobs:
  invalidate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Mark Air Fryer serving generation refresh-required
        run: |
          PYTHONPATH=src python scripts/ranking_authority.py invalidate \
            --vertical air_fryer \
            --metrics output/source_expansion.json \
            --summary output/summary.json \
            --authority output/authority.json \
            --public-authority docs/api/authority.json \
            --manifest docs/api/manifest.json \
            --reason source_or_catalog_generation_advanced

      - name: Mark Slow Cooker serving generation refresh-required
        run: |
          PYTHONPATH=src python scripts/ranking_authority.py invalidate \
            --vertical slow_cooker \
            --metrics verticals/slow_cooker/output/source_expansion.json \
            --summary verticals/slow_cooker/output/summary.json \
            --authority verticals/slow_cooker/output/authority.json \
            --public-authority verticals/slow_cooker/docs/api/authority.json \
            --manifest verticals/slow_cooker/docs/api/manifest.json \
            --reason source_or_catalog_generation_advanced

      - name: Commit authority invalidation when needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            output/summary.json \
            output/authority.json \
            docs/api/manifest.json \
            docs/api/authority.json \
            verticals/slow_cooker/output/summary.json \
            verticals/slow_cooker/output/authority.json \
            verticals/slow_cooker/docs/api/manifest.json \
            verticals/slow_cooker/docs/api/authority.json; do
            [ ! -e "$file" ] || git add "$file"
          done
          if git diff --cached --quiet; then
            echo 'Serving authority already reflects current input generation.'
            exit 0
          fi
          git commit -m 'Invalidate stale recipe ranking authority'
          git pull --rebase origin main
          git push origin HEAD:main
