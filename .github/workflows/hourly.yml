name: Recipe Intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly.yml'
      - '.github/workflows/_vertical-refresh.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'data/benchmarks/**'
  schedule:
    - cron: '17 * * * *'
    - cron: '43 8 * * *'
    - cron: '13 9 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        required: true
        default: deep
        type: choice
        options: [hourly, daily, deep, backfill]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write

# Production runs share one repository-state mutation domain with Slow Cooker,
# Source Expansion, and Source Catalog Sync. At most one production mutation runs
# at a time; newer queued work may coalesce an older pending run. Pull-request
# validation stays isolated per workflow/ref and does not block production.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'recipe-intelligence-production-state' }}
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/_vertical-refresh.yml
    with:
      vertical: air-fryer
      mode: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '43 8 * * *' && 'daily' || github.event.schedule == '13 9 * * 0' && 'deep' || 'hourly' }}
      production: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
