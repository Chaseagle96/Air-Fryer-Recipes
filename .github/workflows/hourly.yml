name: Air Fryer Rankings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly.yml'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'data/benchmarks/**'
  schedule:
    - cron: '17 * * * *'      # hourly incremental refresh
    - cron: '43 8 * * *'      # daily discovery + full known-catalog refresh
    - cron: '13 9 * * 0'      # weekly deep discovery + full refresh
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        required: true
        default: deep
        type: choice
        options:
          - hourly
          - daily
          - deep
          - backfill
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: air-fryer-rankings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      production: ${{ steps.mode.outputs.production }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and quality tooling
        run: pip install -r requirements-dev.txt

      - name: Audit dependencies and generate CycloneDX SBOM
        run: |
          mkdir -p output
          pip-audit -r requirements.txt -f cyclonedx-json -o output/sbom.json

      - name: Lint source and tests
        run: ruff check src tests

      - name: Static type analysis
        shell: bash
        run: |
          mkdir -p output
          set +e
          mypy src/airfryer_rankings 2>&1 | tee output/mypy.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Test with branch coverage
        run: PYTHONPATH=src pytest --cov=airfryer_rankings --cov-report=term-missing --cov-report=xml

      - name: Resolve refresh mode
        id: mode
        shell: bash
        run: |
          mode=hourly
          production=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=smoke
            production=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "43 8 * * *" ]; then
            mode=daily
          elif [ "${{ github.event.schedule }}" = "13 9 * * 0" ]; then
            mode=deep
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "Resolved requested mode: $mode"

      - name: Create bounded PR smoke source set
        if: steps.mode.outputs.mode == 'smoke'
        run: |
          cat > /tmp/smoke-sources.yaml <<'EOF'
          defaults:
            max_urls: 2
            delay: 0.05
          sources:
            - domain: pinchofyum.com
            - domain: budgetbytes.com
              discovery_urls:
                - https://www.budgetbytes.com/category/recipes/air-fryer/
            - domain: skinnytaste.com
              discovery_urls:
                - https://www.skinnytaste.com/recipes/air-fryer/
          EOF

      - name: Refresh rankings
        shell: bash
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "smoke" ]; then
            PYTHONPATH=src python -m airfryer_rankings.run --mode smoke --sources /tmp/smoke-sources.yaml --max-urls 2 --hourly-limit 6
          else
            PYTHONPATH=src python -m airfryer_rankings.run --mode "${{ steps.mode.outputs.mode }}"
          fi

      - name: Capture sanitized publisher fixture candidates
        if: steps.mode.outputs.mode == 'deep' && steps.mode.outputs.production == 'true'
        run: PYTHONPATH=src python -m airfryer_rankings.fixture_capture --output output/fixture_candidates

      - name: Upload Excel workbook
        if: always() && hashFiles('output/air_fryer_rankings.xlsx') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-fryer-rankings-${{ github.run_number }}-${{ steps.mode.outputs.mode || 'validation' }}
          retention-days: 30
          path: output/air_fryer_rankings.xlsx

      - name: Upload DuckDB analytical cache
        if: always() && hashFiles('output/air_fryer_analytics.duckdb') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-fryer-analytics-${{ github.run_number }}-${{ steps.mode.outputs.mode || 'validation' }}
          retention-days: 30
          path: output/air_fryer_analytics.duckdb

      - name: Upload validation and research diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-fryer-diagnostics-${{ github.run_number }}-${{ steps.mode.outputs.mode || 'validation' }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            output/sbom.json
            output/mypy.txt
            output/quality_gate.json
            output/pipeline_metrics.json
            output/pipeline_metrics.csv
            output/historical_backtest.csv
            output/hyperparameter_evaluation.csv
            output/evidence_calibration.csv
            output/evidence_label_results.csv
            output/dedupe_label_queue.csv
            output/storage_health.json
            coverage.xml

      - name: Upload history Parquet archive
        if: always() && hashFiles('output/history_archive.parquet') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: air-fryer-history-${{ github.run_number }}
          retention-days: 30
          path: output/history_archive.parquet

      - name: Upload candidate regression fixtures
        if: always() && hashFiles('output/fixture_candidates/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-candidates-${{ github.run_number }}
          retention-days: 30
          path: output/fixture_candidates

      - name: Upload Pages artifact
        if: steps.mode.outputs.production == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Commit refreshed state, evidence, reports, and dashboard
        if: steps.mode.outputs.production == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/observations data/anomalies data/rankings data/coverage docs
          for file in \
            data/contracts.json \
            data/model/backtest_latest.json \
            output/leaderboard.csv \
            output/top50.csv \
            output/source_coverage.csv \
            output/source_reliability.csv \
            output/source_health.csv \
            output/ranking_robustness.csv \
            output/dedupe_benchmark.csv \
            output/dedupe_label_queue.csv \
            output/pipeline_metrics.csv \
            output/historical_backtest.csv \
            output/hyperparameter_evaluation.csv \
            output/evidence_calibration.csv \
            output/evidence_label_results.csv \
            output/publication_quality_gate.csv \
            output/anomalies.csv \
            output/quality_gate.json \
            output/pipeline_metrics.json \
            output/storage_health.json \
            output/summary.json; do
            [ ! -e "$file" ] || git add "$file"
          done
          if git diff --cached --quiet; then
            echo 'No ranking changes to commit.'
            exit 0
          fi
          git commit -m "Refresh air fryer rankings (${{ steps.mode.outputs.mode }})"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-pages:
    if: needs.refresh.outputs.production == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
