name: One-time Source Expansion State Isolation

on:
  push:
    branches: [agent/autonomous-source-expansion]
    paths:
      - '.github/workflows/source-expansion-state-isolation.yml'

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/autonomous-source-expansion
          fetch-depth: 0
      - name: Keep source-expansion commits out of ranking state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/airfryer_rankings/source_expansion.py')
          text = source.read_text(encoding='utf-8')
          text = text.replace(
              'from .storage import load_state, save_state, write_run_records',
              'from .storage import load_state, write_run_records',
          )
          old = '''                if outcome in {PROMOTED, ACTIVE} and str(record.get("status")) in {PROMOTED, ACTIVE}:\n                    if outcome == PROMOTED:\n                        promotions += 1\n                    catalog_result = _promoted_catalog_discovery(context, record, mode, budget, run_at)\n                    if catalog_result is not None:\n                        metrics["promotion_catalog_discovery"] = catalog_result\n'''
          new = '''                if outcome in {PROMOTED, ACTIVE} and str(record.get("status")) in {PROMOTED, ACTIVE}:\n                    if outcome == PROMOTED:\n                        promotions += 1\n                    metrics["production_activation"] = (\n                        "effective allowlist immediately; URL catalog expansion on the next vertical daily/deep discovery run"\n                    )\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''            save_source_registry(context.registry_path, context.registry)\n            save_state(context.state_path, context.state)\n            context.output_dir.mkdir(parents=True, exist_ok=True)\n'''
          new = '''            save_source_registry(context.registry_path, context.registry)\n            context.output_dir.mkdir(parents=True, exist_ok=True)\n'''
          assert old in text
          source.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/source-expansion.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          git add data/source_registry.json verticals/slow_cooker/data/source_registry.json\n          git add data/state.json verticals/slow_cooker/data/state.json\n'''
          new = '''          git add data/source_registry.json verticals/slow_cooker/data/source_registry.json\n'''
          assert old in text
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          docs = Path('SOURCE_DISCOVERY.md')
          text = docs.read_text(encoding='utf-8')
          old = '''When a candidate is promoted, its machine-owned `crawl_config` contains its relevant sitemap/discovery entry points, inclusion pattern, crawl delay, and URL cap. It immediately becomes part of the effective allowlist. A bounded catalog-discovery pass can seed the vertical URL catalog, and subsequent normal daily/deep discovery uses the same existing `discover_source_urls()` path as manual sources.\n'''
          new = '''When a candidate is promoted, its machine-owned `crawl_config` contains its relevant sitemap/discovery entry points, inclusion pattern, crawl delay, and URL cap. It immediately becomes part of the effective allowlist. The next normal vertical daily/deep discovery run uses the same existing `discover_source_urls()` path as manual sources to seed and expand the persistent URL catalog. Source-expansion automation deliberately does not write ranking state files itself, avoiding cross-workflow state races while keeping promotion automatic.\n'''
          assert old in text
          docs.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit isolation and remove temporary workflow
        run: |
          rm .github/workflows/source-expansion-state-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/airfryer_rankings/source_expansion.py .github/workflows/source-expansion.yml SOURCE_DISCOVERY.md .github/workflows/source-expansion-state-isolation.yml
          git commit -m 'Isolate source expansion from ranking state writes'
          git push origin HEAD:agent/autonomous-source-expansion
